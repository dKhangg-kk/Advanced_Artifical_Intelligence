[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-four-ai"
version = "0.1.0"
description = "Game AI da cap do cho Connect Four 7x6 - do an cuoi ky TTNTNC"
readme = "README.md"
requires-python = ">=3.10"

# Goi loi chi can numpy; cac thu vien nang khai bao o optional-dependencies.
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
# Huan luyen NN/RL
torch = ["torch>=2.2,<3"]
# Giao dien pygame
ui = ["pygame>=2.5,<3"]
# Giai dau + phan tich ket qua
analysis = ["PyYAML>=6.0,<7", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "psutil>=5.9"]
# Phat trien / kiem thu
dev = ["pytest>=8.0,<9"]

[project.scripts]
# Sau khi `pip install -e .` se co cac lenh nay
c4-play = "connect_four.play:main"
c4-tournament = "connect_four.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
