# Che do "cau hinh mac dinh": moi tac tu dung tham so rieng da cong bo.
# 6 tac tu = 15 cap x 200 van = 3000 van.
#
# Cap nhat 20/11/2026 (Y4/Y6): tep nay da duoc dong bo voi cau hinh giai dau chinh thuc
# configs/tournament_y6_default.yaml (run tournament-default-20261118T163224Z-s20261118).
# Ban truoc dung seed 20261102 trung voi seed validation DQN; da doi sang seed giai dau
# 20261118 de khong tron seed chon mo hinh voi seed danh gia cuoi.

mode: default
games_per_pair: 200
openings: 100          # moi khai cuoc choi 2 van, doi ben -> 200 van/cap
seed: 20261118
max_moves: 42
time_per_move_s: null
agent_config: configs/agents_y6.yaml   # checkpoint dong bang: level5_cnn/final.pt, level6_dqn/final.pt

agents:
  - random
  - heuristic
  - alphabeta
  - mcts
  - nn
  - dqn

output_dir: results/logs
figures_dir: results/figures
tables_dir: results/tables
