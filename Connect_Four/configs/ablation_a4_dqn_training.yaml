# A4 fallback theo muc "Cat giam" trong ke hoach:
# Mot run 10.000 episode da vuot 1 gio; giu 2 seed (0, 42), bo decay cham 0.9998.
# Checkpoint duoc chon bang validation co dinh, khong dung tournament lam test.
name: ablation_a4_dqn_training
agent: dqn
episodes: 10000
training_opponent: heuristic
lr: 0.001
gamma: 0.99
epsilon_start: 1.0
epsilon_min: 0.05
buffer_size: 100000
batch_size: 64
target_update_freq: 500
device: cpu
milestones: [1000, 2500, 5000, 10000]
epsilon_decay_configs:
  - {name: fast_decay, decay: 0.9990, eps_min: 0.05}
  - {name: default_decay, decay: 0.9995, eps_min: 0.05}
opponents: [random, heuristic]
eval_games_per_milestone: 100
seeds: [0, 42]
validation_seeds:
  random: 20261102
  heuristic: 20261103
output: results/tables/ablation_a4_results.csv
