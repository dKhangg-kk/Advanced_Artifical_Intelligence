name: Nhu Y - DQN heuristic and experiment audit

on:
  push:
    branches:
      - feat/nhu-y-dqn-heuristic-audit
    paths:
      - "Connect_Four/scripts/run_nhu_y_dqn_heuristic.py"
      - ".github/workflows/nhu-y-dqn-heuristic-audit.yml"

permissions:
  contents: write

jobs:
  run-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Connect_Four
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nhu-y-dqn-heuristic-audit
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Connect_Four/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run DQN vs Heuristic and audit assignments
        run: python scripts/run_nhu_y_dqn_heuristic.py

      - name: Rebuild experiment workbook
        run: python scripts/build_experiment_workbook.py

      - name: Run project test suite
        run: python -m pytest -q

      - name: Commit verified run and audit outputs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Connect_Four/results/logs/run_manifest.csv
          git add Connect_Four/results/experiment_assignments.csv
          git add Connect_Four/results/experiment_plan.csv
          git add Connect_Four/results/experiment_schedule.xlsx
          git add Connect_Four/results/audit_nhu_y_runs.md
          git add Connect_Four/docs/EXPERIMENT_LOG.md
          git add Connect_Four/docs/contributions/phan-le-ngoc-nhu-y.md
          git commit -m "Connect_Four/DuAn/Chay DQN-Heuristic va audit 49 run cua Nhu Y" || echo "No output changes to commit"
          git push origin HEAD:feat/nhu-y-dqn-heuristic-audit
